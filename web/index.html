<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DietClient · Web 调试</title>
    <style>
      :root {
        /* 手机屏幕模拟尺寸：默认 iPhone 14/15（改安卓可设 412px / 915px） */
        --phone-w: 390px;
        --phone-h: 844px;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        /* border-box：让 height:100% 把 padding 算在内，避免 body 溢出导致页面可滚动 */
        box-sizing: border-box;
        /* 禁止页面本体滚动：避免滚轮在手机画框内滚到底后，
           链式传导带动深色背景和画框一起上下滑动 */
        overflow: hidden;
        overscroll-behavior: none;
      }
      body {
        background: #1e1e2f;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #root {
        width: 100%;
        height: 100%;
        background: #fff;
        overflow: hidden;
        position: relative;
        /* 关键：作为 flex 容器，让 App 内部 SafeAreaView/ScrollView 的
           flex:1 沿有界高度正确解析，否则 ScrollView 高度=内容高度导致无法滚动 */
        display: flex;
        flex-direction: column;
      }
      /* 桌面宽浏览器：居中显示手机尺寸画框（高度自适应窗口，避免 900px 屏不触发）；
         窄视口（如 DevTools 设备模式 / 手机浏览器）下自动铺满全屏，
         此时 window.innerWidth 即真实手机尺寸，Dimensions 返回正确值。 */
      @media (min-width: 500px) {
        body {
          padding: 12px;
        }
        #root {
          width: var(--phone-w);
          height: min(var(--phone-h), calc(100vh - 24px));
          border-radius: 44px;
          box-shadow: 0 0 0 10px #000, 0 24px 60px rgba(0, 0, 0, 0.55);
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>

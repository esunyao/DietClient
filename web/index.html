<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F5F8FC" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='32' fill='%230071E3'/%3E%3Cpath d='M23 18v28M31 18v28M23 25h8M39 18v28M39 31h8M47 18v28' fill='none' stroke='white' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>NutriAI · Web 调试</title>
    <style>
      :root {
        /* 手机屏幕模拟尺寸：默认 iPhone 14/15（改安卓可设 412px / 915px） */
        --phone-w: 390px;
        --phone-h: 844px;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        /* border-box：让 height:100% 把 padding 算在内，避免 body 溢出导致页面可滚动 */
        box-sizing: border-box;
        /* 禁止页面本体滚动：避免滚轮在手机画框内滚到底后，
           链式传导带动深色背景和画框一起上下滑动 */
        overflow: hidden;
        overscroll-behavior: none;
      }
      body {
        background: radial-gradient(circle at 12% 18%, rgba(0, 113, 227, 0.14), transparent 28%),
          radial-gradient(circle at 86% 82%, rgba(52, 199, 89, 0.14), transparent 30%), #f5f5f7;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #root {
        width: 100%;
        height: 100%;
        background: #f5f8fc;
        overflow: hidden;
        position: relative;
        /* 关键：作为 flex 容器，让 App 内部 SafeAreaView/ScrollView 的
           flex:1 沿有界高度正确解析，否则 ScrollView 高度=内容高度导致无法滚动 */
        display: flex;
        flex-direction: column;
      }
      /* 桌面宽浏览器：居中显示手机尺寸画框（高度自适应窗口，避免 900px 屏不触发）；
         窄视口（如 DevTools 设备模式 / 手机浏览器）下自动铺满全屏，
         此时 window.innerWidth 即真实手机尺寸，Dimensions 返回正确值。 */
      @media (min-width: 500px) {
        body {
          padding: 12px;
        }
        #root {
          width: var(--phone-w);
          height: min(var(--phone-h), calc(100vh - 24px));
          border: 1px solid rgba(255, 255, 255, 0.84);
          border-radius: 32px;
          box-shadow: 0 28px 70px rgba(38, 62, 89, 0.18);
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>

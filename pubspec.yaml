name: diet_client
description: Flutter nutrition UI for personal and institution experiences.
publish_to: none
version: 1.0.0+1

# 运行环境
environment:
  sdk: ^3.13.5
workspace:
  - packages/diet_models
  - packages/diet_ui
  - packages/diet_oidc
  - packages/diet_auth

# 项目依赖
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  diet_models: any
  diet_ui: any
  diet_auth: any
  diet_oidc: any
  dio: 5.11.1
  shared_preferences: 2.5.6
  flutter_secure_storage: 11.2.0
  flutter_timezone: 5.1.1
  uuid: 4.6.0
  mime: 2.1.0
  image_picker: 1.2.4
  image: 4.12.0
  go_router: 18.1.0
  flutter_riverpod: 3.4.3
# 开发依赖（仅在开发时使用）
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  change_app_package_name: ^1.5.0

# Flutter 配置
flutter:
  uses-material-design: true
  assets:
    - assets/images/home_capture_bowl.png

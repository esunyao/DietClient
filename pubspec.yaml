name: diet_client
description: Flutter nutrition UI for personal and institution experiences.
publish_to: none
version: 1.0.0+1
environment:
  sdk: ^3.13.5
workspace:
  - packages/diet_models
  - packages/diet_ui
  - packages/diet_oidc
  - packages/diet_auth
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  diet_models: any
  diet_ui: any
  diet_auth: any
  go_router: 18.1.0
  flutter_riverpod: 3.4.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/images/home_capture_bowl.png
